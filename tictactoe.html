<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #e94560;
    }

    #status {
      font-size: 1.2rem;
      margin-bottom: 1.2rem;
      min-height: 1.6em;
      color: #a8dadc;
      font-weight: 600;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
    }

    .cell {
      background: #16213e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #0f3460;
      transform: scale(1.05);
    }

    .cell.x { color: #e94560; }
    .cell.o { color: #a8dadc; }

    .cell.win {
      background: #0f3460;
      box-shadow: 0 0 18px 4px rgba(233, 69, 96, 0.5);
      animation: pulse 0.6s ease-in-out;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    #scores {
      display: flex;
      gap: 2rem;
      margin-top: 1.5rem;
      font-size: 1rem;
    }

    .score-box {
      text-align: center;
      background: #16213e;
      border-radius: 10px;
      padding: 0.6rem 1.2rem;
    }

    .score-box .label { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .score-box .val   { font-size: 1.8rem; font-weight: 700; }
    .score-box.x-score .val { color: #e94560; }
    .score-box.o-score .val { color: #a8dadc; }
    .score-box.tie-score .val { color: #ffd166; }

    #reset {
      margin-top: 1.5rem;
      padding: 0.7rem 2.2rem;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    #reset:hover { background: #c73652; transform: scale(1.04); }

    #mode-toggle {
      margin-top: 0.8rem;
      padding: 0.5rem 1.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: #0f3460;
      color: #a8dadc;
      border: 2px solid #a8dadc;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    #mode-toggle:hover { background: #16213e; }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div id="status">X's turn</div>
  <div id="board"></div>

  <div id="scores">
    <div class="score-box x-score">
      <div class="label">X</div>
      <div class="val" id="score-x">0</div>
    </div>
    <div class="score-box tie-score">
      <div class="label">Ties</div>
      <div class="val" id="score-tie">0</div>
    </div>
    <div class="score-box o-score">
      <div class="label">O</div>
      <div class="val" id="score-o">0</div>
    </div>
  </div>

  <button id="reset">New Game</button>
  <button id="mode-toggle">vs CPU: OFF</button>

  <script>
    const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    let board, current, gameOver, vsCPU;
    let scores = { X: 0, O: 0, T: 0 };

    const cells = [];
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');

    for (let i = 0; i < 9; i++) {
      const c = document.createElement('div');
      c.className = 'cell';
      c.addEventListener('click', () => handleClick(i));
      boardEl.appendChild(c);
      cells.push(c);
    }

    document.getElementById('reset').addEventListener('click', startGame);
    document.getElementById('mode-toggle').addEventListener('click', () => {
      vsCPU = !vsCPU;
      document.getElementById('mode-toggle').textContent = `vs CPU: ${vsCPU ? 'ON' : 'OFF'}`;
      startGame();
    });

    function startGame() {
      board = Array(9).fill(null);
      current = 'X';
      gameOver = false;
      cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
      statusEl.textContent = "X's turn";
    }

    function handleClick(i) {
      if (gameOver || board[i]) return;
      if (vsCPU && current === 'O') return;
      play(i);
      if (vsCPU && !gameOver && current === 'O') {
        setTimeout(cpuMove, 300);
      }
    }

    function play(i) {
      board[i] = current;
      cells[i].textContent = current;
      cells[i].classList.add(current.toLowerCase(), 'taken');

      const win = getWin();
      if (win) {
        win.forEach(idx => cells[idx].classList.add('win'));
        statusEl.textContent = `${current} wins!`;
        scores[current]++;
        updateScores();
        gameOver = true;
        return;
      }
      if (board.every(Boolean)) {
        statusEl.textContent = "It's a tie!";
        scores.T++;
        updateScores();
        gameOver = true;
        return;
      }
      current = current === 'X' ? 'O' : 'X';
      statusEl.textContent = `${current}'s turn`;
    }

    function getWin() {
      for (const [a,b,c] of WINS) {
        if (board[a] && board[a] === board[b] && board[a] === board[c]) return [a,b,c];
      }
      return null;
    }

    function cpuMove() {
      // minimax
      let best = -Infinity, move = -1;
      for (let i = 0; i < 9; i++) {
        if (!board[i]) {
          board[i] = 'O';
          const score = minimax(board, 0, false);
          board[i] = null;
          if (score > best) { best = score; move = i; }
        }
      }
      if (move !== -1) play(move);
    }

    function minimax(b, depth, isMax) {
      const win = getWinForBoard(b);
      if (win === 'O') return 10 - depth;
      if (win === 'X') return depth - 10;
      if (b.every(Boolean)) return 0;

      if (isMax) {
        let best = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (!b[i]) { b[i] = 'O'; best = Math.max(best, minimax(b, depth+1, false)); b[i] = null; }
        }
        return best;
      } else {
        let best = Infinity;
        for (let i = 0; i < 9; i++) {
          if (!b[i]) { b[i] = 'X'; best = Math.min(best, minimax(b, depth+1, true)); b[i] = null; }
        }
        return best;
      }
    }

    function getWinForBoard(b) {
      for (const [a,w,c] of WINS) {
        if (b[a] && b[a] === b[w] && b[a] === b[c]) return b[a];
      }
      return null;
    }

    function updateScores() {
      document.getElementById('score-x').textContent = scores.X;
      document.getElementById('score-o').textContent = scores.O;
      document.getElementById('score-tie').textContent = scores.T;
    }

    vsCPU = false;
    startGame();
  </script>
</body>
</html>
